[package]
name = "easytcp"
version = "1.0.0-rc1"
edition = "2024"
rust-version = "1.85"
description = "Create async network applications easily!"
license = "GPL-3.0"
repository = "https://github.com/mrtnvgr/easytcp/"
readme = "README.md"
documentation = "https://docs.rs/easytcp"
keywords = ["networking", "async", "tokio", "tcp"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net", "io-util", "sync"] }
postcard = { version = "1.1.1", features = ["use-std"] }
serde = { version = "1.0.219", features = ["derive"] }
trait-set = "0.5.0"
thiserror = "2.0"
scc = "3.8.8"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
getrandom = "0.4"
log = "0.4"

[dev-dependencies]
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "time"] }
